name: CI — Validate & Build

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate all entries
  # ─────────────────────────────────────────────
  validate:
    name: Validate entries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run validate.py
        run: python scripts/validate.py

  # ─────────────────────────────────────────────
  # Job 2: Build artifacts (main push or tag)
  # ─────────────────────────────────────────────
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run build.py
        run: python scripts/build.py

      - name: Commit updated dist/ and docs/ files
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ docs/acronyms_data.js README.md
          git diff --staged --quiet || git commit -m "chore(build): regenerate dist artifacts [skip ci]"
          git push

      - name: Upload JSON as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortTechBible-JSON
          path: dist/acronyms.json
          retention-days: 30

      - name: Upload CSV as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortTechBible-CSV
          path: dist/acronyms.csv
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Create GitHub Release on tag push
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JSON artifact
        uses: actions/download-artifact@v4
        with:
          name: ShortTechBible-JSON
          path: dist/

      - name: Download CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: ShortTechBible-CSV
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/acronyms.json
            dist/acronyms.csv
          generate_release_notes: true
          draft: false
          prerelease: false

  # ─────────────────────────────────────────────
  # Job 4: Deploy GitHub Pages
  # ─────────────────────────────────────────────
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
