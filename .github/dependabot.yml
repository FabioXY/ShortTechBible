version: 2
updates:
  # Keep GitHub Actions versions up to date automatically.
  # Dependabot opens a PR once a week if any action has a newer version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(actions)"
